[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadscraper"
version = "0.1.0"
description = "B2B-Lead-Scraper: Google Places + Firmenwebsites -> Excel-Listen für Kaltakquise (KI-Weiterbildung mit Förderung)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tenacity>=8",
    "phonenumbers>=8.13",
    "tldextract>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.4"]
browser = ["playwright>=1.44"]

[project.scripts]
leadscraper = "leadscraper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/leadscraper/cli.py" = ["B008"]  # typer.Option in Defaults ist das typer-Idiom
