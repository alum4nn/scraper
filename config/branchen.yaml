# Suchprofile: ein Profil = mehrere Google-Places-Textsuchen.
# Ziel: kleine Betriebe (5-50 Mitarbeitende) mit hoher Förderquote (§82 SGB III) und
# realistischem KI-Weiterbildungsbedarf. Aufruf: leadscraper run --profile handwerk --city Köln
#
# included_type (optional) = offizieller Google-Place-Type (Tabelle A). Nur EIN Typ pro Suche möglich.
profiles:
  makler:
    beschreibung: "Immobilienmakler und Hausverwaltungen – Handynummer des Chefs auf der Website, Innendienst im Haus"
    # Reihenfolge zählt: --deutschland nutzt je Ort nur die ersten Suchbegriffe (Kostenbremse).
    # "Hausverwaltung" bringt ~80 % Firmen, die unter "Immobilienmakler" nicht auftauchen, und trifft
    # das Zielsegment besser: Verwaltungen haben Buchhaltung und Innendienst, also echte Beschäftigte.
    queries:
      - "Immobilienmakler"
      - "Hausverwaltung"
      - "Immobilienbüro"
      - "Immobilienvermittlung"
      - "Makler Wohnung Haus"
    included_types: [real_estate_agency]
  # --- Aus der Branchenrecherche vom 15.09.2026 (siehe docs/BRANCHEN.md) -------------------------
  # Sortiert nach belegter Eignung. Entscheidend ist nicht der KI-Druck allein, sondern die
  # Betriebsgröße: Bei Maklern haben 96,8 % der Niederlassungen unter zehn Beschäftigte
  # (Destatis-Unternehmensregister 2024), deshalb blieb die Ausbeute bei 1,7 %.
  steuerberatung:
    beschreibung: "Steuerkanzleien – Ø 4,5 Beschäftigte je Einzelpraxis, Ø 32,8 je Berufsausübungsgesellschaft (STAX 2024); Kammer leitet aus Art. 4 KI-VO eine Fortbildungspflicht ab"
    queries:
      - "Steuerberater"
      - "Steuerberatungsgesellschaft"
      - "Steuerkanzlei"
      - "Lohnbuchhaltung Büro"
    included_types: [accounting]
  pflegedienst:
    beschreibung: "Ambulante Pflegedienste und Tagespflege – 15.549 Dienste, Ø 28,7 Beschäftigte, 68,5 % privat (Pflegestatistik 2023); Altenpflege ist mit rund einem Drittel aller Zugänge größter Nutzer der Förderung"
    # Kein included_type: „Pflegedienst“ hat in Table A keinen eigenen Typ, ein falscher Typ
    # lässt die Textsuche ins Leere laufen.
    queries:
      - "Ambulanter Pflegedienst"
      - "Pflegedienst"
      - "Tagespflege"
      - "Intensivpflegedienst"
      - "Seniorenbetreuung Pflege"
  zahnarztpraxis:
    beschreibung: "Zahnarztpraxen – 37.423 Praxen, Ø 8,13 Beschäftigte ohne Inhaber (KZBV-Jahrbuch 2025), fast ausschließlich sozialversicherungspflichtige ZFA"
    queries:
      - "Zahnarztpraxis"
      - "Zahnarzt"
      - "Kieferorthopädie Praxis"
    included_types: [dentist]
  apotheke:
    beschreibung: "Apotheken – 16.601 Betriebe, knapp 10 Beschäftigte je Betrieb, 12.802 Inhaber (ABDA Juni 2026); Fremdbesitzverbot, also fast immer inhabergeführt"
    queries:
      - "Apotheke"
      - "Stadtapotheke"
    included_types: [pharmacy]
  kfz_betrieb:
    beschreibung: "Autohäuser und Kfz-Werkstätten – 36.030 Betriebe mit 428.000 Beschäftigten, Ø 11,9 (ZDK 2024); Kfz-Gewerbe liegt über dem Handwerksschnitt"
    queries:
      - "Autohaus"
      - "Kfz-Werkstatt"
      - "Kfz-Meisterbetrieb"
      - "Autoservice Werkstatt"
    included_types: [car_repair, car_dealer]
  spedition:
    beschreibung: "Speditionen und Logistikdienstleister – rund die Hälfte der 46.902 Güterkraftverkehrs-Unternehmen hat 5–49 Beschäftigte (BALM 2020); Berufskraftfahrer sind zweithäufigster geförderter Zielberuf"
    queries:
      - "Spedition"
      - "Transportunternehmen"
      - "Logistikunternehmen"
      - "Lagerlogistik Dienstleister"
  planungsbuero:
    beschreibung: "Architektur- und Ingenieurbüros – 7.558 von 34.986 Architekturbüros haben 5–49 Beschäftigte (BAK/Destatis 2023); 77 % der Architekten wünschen KI-Fortbildung"
    queries:
      - "Architekturbüro"
      - "Ingenieurbüro"
      - "Planungsbüro Bau"
      - "Statikbüro"
  elektro_shk:
    beschreibung: "Elektro- und SHK-Betriebe – 48.178 E-Betriebe (Ø 10,7) und 48.050 SHK-Betriebe (Ø 8,1); 76 % der Handwerksbetriebe sehen Digitalkompetenzbedarf, nur 4 % nutzen KI (Bitkom 2025)"
    queries:
      - "Elektrotechnik Betrieb"
      - "Elektroinstallation Meisterbetrieb"
      - "Sanitär Heizung Klima Betrieb"
      - "Heizungsbau Betrieb"
    included_types: [electrician, plumber]
  metallbau:
    beschreibung: "Metallbau und Schlossereien – beste Belegschafts-Datenlage der Stichprobe (6 von 10 Betrieben belegen 5+), 53 % der Innungsbetriebe haben 5–25 Beschäftigte; Meister sitzt an der Betriebsadresse"
    # Kein included_type: „locksmith“ ist der Schlüsseldienst, nicht die Schlosserei – ein falscher Typ
    # verdirbt die Trefferliste. Deshalb Textsuche mit mehreren Begriffen.
    queries:
      - "Metallbau"
      - "Schlosserei"
      - "Metallbaumeister"
      - "Stahlbau Metallbau"
  dentallabor:
    beschreibung: "Zahntechnische Labore – 9 von 10 nennen den Inhaber, 7 von 10 belegen die Belegschaft (eigene Stichprobe 15.09.2026); ortsfester Betrieb, deshalb praktisch nie eine Handynummer"
    queries:
      - "Dentallabor"
      - "Zahntechnik"
      - "Zahntechnisches Labor"
      - "Zahntechnisches Meisterlabor"
  versicherung:
    beschreibung: "Versicherungs-/Finanzmakler – Vertriebler mit Handy, Büro-Personal mit Verwaltungsaufwand"
    queries:
      - "Versicherungsmakler"
      - "Versicherungsbüro"
      - "Finanzberatung"
      - "Versicherungsagentur"
    included_types: [insurance_agency]
  handwerk:
    beschreibung: "Handwerksbetriebe (Elektro, SHK, Bau, Schreiner, Maler) – meist Inhaber-geführt, oft Handynummer auf der Website"
    queries:
      - "Elektrotechnik Betrieb"
      - "Sanitär Heizung Klima Betrieb"
      - "Schreinerei"
      - "Malerbetrieb"
      - "Dachdecker"
      - "Bauunternehmen"
      - "Metallbau"
    included_types: [electrician, plumber, roofing_contractor, general_contractor, painter]
  steuer_recht:
    beschreibung: "Steuerberater, Wirtschaftsprüfer, Kanzleien – hoher Bürokratieanteil, KI-affin"
    queries:
      - "Steuerberater"
      - "Steuerberatungsgesellschaft"
      - "Rechtsanwaltskanzlei"
      - "Wirtschaftsprüfer"
    included_types: [accounting, lawyer]
  gesundheit:
    beschreibung: "Praxen, Pflegedienste, Physiotherapie, Apotheken – Dokumentationslast, viele Angestellte"
    queries:
      - "Pflegedienst"
      - "Physiotherapie Praxis"
      - "Zahnarztpraxis"
      - "Apotheke"
      - "Augenoptiker"
    included_types: [physiotherapist, dentist, pharmacy, home_health_care_service]
  auto_technik:
    beschreibung: "Autohäuser, Kfz-Werkstätten – Inhaber-geführt, 10-50 MA typisch"
    queries:
      - "Autohaus"
      - "Kfz-Werkstatt"
      - "Autolackiererei"
    included_types: [car_dealer, car_repair]
  agenturen_it:
    beschreibung: "Werbeagenturen, IT-Dienstleister, Softwarehäuser – KI-Nachfrage sehr hoch"
    queries:
      - "Werbeagentur"
      - "IT-Dienstleister"
      - "Softwareentwicklung"
      - "Digitalagentur"
  logistik_handel:
    beschreibung: "Spedition, Großhandel, Lager – Prozessdigitalisierung"
    queries:
      - "Spedition"
      - "Großhandel"
      - "Logistikunternehmen"
      - "Kurierdienst"
    included_types: [moving_company, courier_service]
  produktion:
    beschreibung: "Kleine Industrie/Maschinenbau/Zulieferer"
    queries:
      - "Maschinenbau"
      - "Metallverarbeitung"
      - "Kunststoffverarbeitung"
      - "Werkzeugbau"
      - "Feinmechanik"
  immobilien_finanzen:
    beschreibung: "Makler, Hausverwaltungen, Versicherungsbüros"
    queries:
      - "Immobilienmakler"
      - "Hausverwaltung"
      - "Versicherungsbüro"
    included_types: [real_estate_agency, insurance_agency]
  gastro_hotel:
    beschreibung: "Hotels & größere Gastronomie (nur bedingt KI-affin, aber Personalstärke passt)"
    queries:
      - "Hotel"
      - "Restaurant"
      - "Catering"
    included_types: [hotel, restaurant]
