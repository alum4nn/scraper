# Suchprofile: ein Profil = mehrere Google-Places-Textsuchen.
# Ziel: kleine Betriebe (5-50 Mitarbeitende) mit hoher Förderquote (§82 SGB III) und
# realistischem KI-Weiterbildungsbedarf. Aufruf: leadscraper run --profile handwerk --city Köln
#
# included_type (optional) = offizieller Google-Place-Type (Tabelle A). Nur EIN Typ pro Suche möglich.
profiles:
  makler:
    beschreibung: "Immobilienmakler und Hausverwaltungen – Handynummer des Chefs auf der Website, Innendienst im Haus"
    # Reihenfolge zählt: --deutschland nutzt je Ort nur die ersten Suchbegriffe (Kostenbremse).
    # "Hausverwaltung" bringt ~80 % Firmen, die unter "Immobilienmakler" nicht auftauchen, und trifft
    # das Zielsegment besser: Verwaltungen haben Buchhaltung und Innendienst, also echte Beschäftigte.
    queries:
      - "Immobilienmakler"
      - "Hausverwaltung"
      - "Immobilienbüro"
      - "Immobilienvermittlung"
      - "Makler Wohnung Haus"
    included_types: [real_estate_agency]
  # --- Aus der Branchenrecherche vom 15.09.2026 (siehe docs/BRANCHEN.md) -------------------------
  # Sortiert nach belegter Eignung. Entscheidend ist nicht der KI-Druck allein, sondern die
  # Betriebsgröße: Bei Maklern haben 96,8 % der Niederlassungen unter zehn Beschäftigte
  # (Destatis-Unternehmensregister 2024), deshalb blieb die Ausbeute bei 1,7 %.
  steuerberatung:
    beschreibung: "Steuerkanzleien – Ø 4,5 Beschäftigte je Einzelpraxis, Ø 32,8 je Berufsausübungsgesellschaft (STAX 2024); Kammer leitet aus Art. 4 KI-VO eine Fortbildungspflicht ab"
    queries:
      - "Steuerberater"
      - "Steuerberatungsgesellschaft"
      - "Steuerkanzlei"
      - "Lohnbuchhaltung Büro"
    included_types: [accounting]
    osm:
      - '["office"="tax_advisor"]'
  pflegedienst:
    beschreibung: "Ambulante Pflegedienste und Tagespflege – 15.549 Dienste, Ø 28,7 Beschäftigte, 68,5 % privat (Pflegestatistik 2023); Altenpflege ist mit rund einem Drittel aller Zugänge größter Nutzer der Förderung"
    # Kein included_type: „Pflegedienst“ hat in Table A keinen eigenen Typ, ein falscher Typ
    # lässt die Textsuche ins Leere laufen.
    queries:
      - "Ambulanter Pflegedienst"
      - "Pflegedienst"
      - "Tagespflege"
      - "Intensivpflegedienst"
      - "Seniorenbetreuung Pflege"
    # Gemessen am 15.09.2026: ambulatory_care ist laut OSM-Wiki das Tag für den ambulanten Dienst
    # (2.807 Objekte, 1.464 mit Website). healthcare=nurse hat bundesweit 23 Objekte, outreach trifft
    # zu 95 % Beratungsstellen. Der Namensregex findet 767 Betriebe, die gar kein passendes Tag tragen.
    osm:
      - '["social_facility"="ambulatory_care"]'
      - '["name"~"Pflegedienst|Sozialstation|Diakoniestation|Pflegeteam|Ambulante Pflege|Ambulanter Pflege|Häusliche Kranken|Hauskranken|Mobile Pflege|Pflegeservice",i]'
    # Unter denselben Tags stehen Heime, Tagespflege und betreutes Wohnen – die haben andere Entscheider
    osm_nicht_name: 'Pflegeheim|Seniorenheim|Altenheim|Seniorenzentrum|Seniorenresidenz|Pflegezentrum|Tagespflege|Kurzzeitpflege|Betreutes Wohnen|Wohnstift|Altenpflegeheim|Hospiz'
  pflegeheim:
    beschreibung: "Pflegeheime, privat und konzernfrei – rund 4.500 bis 5.000 im Zielkorridor; reißen die Förderschwelle von 50 erst bei 74 Köpfen, weil 59,7 % Teilzeit nur anteilig zählen (§ 82 Abs. 6 SGB III)"
    # Trägerprüfung vor dem Anruf: Caritas, Diakonie, AWO, DRK und die Heimketten zählen als ein
    # Unternehmen und fallen deshalb aus dem 100-Prozent-Band. Sie stehen in config/ausschluss.yaml.
    osm:
      - '["social_facility"="nursing_home"]'
      - '["amenity"="nursing_home"]'
    osm_nicht_name: 'Tagespflege|Kurzzeitpflege|Betreutes Wohnen|Wohngemeinschaft|Hospiz|Sozialstation|ambulant'
    queries:
      - "Pflegeheim"
      - "Seniorenheim"
      - "Altenpflegeheim"
      - "Seniorenresidenz"
  zahnarztpraxis:
    beschreibung: "Zahnarztpraxen – 37.423 Praxen, Ø 8,13 Beschäftigte ohne Inhaber (KZBV-Jahrbuch 2025), fast ausschließlich sozialversicherungspflichtige ZFA"
    queries:
      - "Zahnarztpraxis"
      - "Zahnarzt"
      - "Kieferorthopädie Praxis"
    included_types: [dentist]
    osm:
      - '["amenity"="dentist"]'
      - '["healthcare"="dentist"]'
  apotheke:
    beschreibung: "Apotheken – 16.601 Betriebe, knapp 10 Beschäftigte je Betrieb, 12.802 Inhaber (ABDA Juni 2026); Fremdbesitzverbot, also fast immer inhabergeführt"
    queries:
      - "Apotheke"
      - "Stadtapotheke"
    included_types: [pharmacy]
    osm:
      - '["amenity"="pharmacy"]'
  kfz_betrieb:
    beschreibung: "Autohäuser und Kfz-Werkstätten – 36.030 Betriebe mit 428.000 Beschäftigten, Ø 11,9 (ZDK 2024); Kfz-Gewerbe liegt über dem Handwerksschnitt"
    queries:
      - "Autohaus"
      - "Kfz-Werkstatt"
      - "Kfz-Meisterbetrieb"
      - "Autoservice Werkstatt"
    included_types: [car_repair, car_dealer]
    osm:
      - '["shop"="car_repair"]'
      - '["shop"="car"]'
  spedition:
    beschreibung: "Speditionen ohne eigenen Fuhrpark (HGB-Spediteur) – 2.146 Unternehmen mit 20–49 tätigen Personen (Eurostat SBS 2023), 37 % kaufmännisches Personal, und mit 13 % die niedrigste KI-Nutzung aller Dienstleistungsbranchen"
    # Entscheidend ist die Trennung zweier Betriebstypen, die dieselbe Firmierung tragen:
    # Beim Frachtführer sind 73,7 % der Belegschaft Fahrpersonal und nur 14,9 % kaufmännisch
    # (BALM USTAT 19, 2020) – eine 30-Mann-Firma hat dort 4 bis 6 schulbare Köpfe. Beim
    # HGB-Spediteur, der organisiert statt fährt, sind es 37 % kaufmännisch plus 3 % Inhaber
    # (DSLV-Strukturerhebung 2015), also 12 bis 13 Köpfe. Nur der zweite Typ trägt die Kampagne.
    # An der Website erkennbar: Zollabfertigung, See- und Luftfracht, ADSp als AGB und
    # Mitgliedschaft in einer Stückgut-Kooperation sprechen für den Spediteur; eine Fuhrparkseite
    # mit Euro-Normen und Dauerinserate "Berufskraftfahrer CE" für den Frachtführer.
    #
    # Nicht mehr verwendet: Die 817 Sammelanträge aus Verkehr und Lagerei taugen als Argument
    # nicht – 68 % kamen von Unternehmen mit 2.500 und mehr Beschäftigten, und die Bildungsziele
    # waren überwiegend Triebfahrzeugführer und Kfz-Technik (Statistik der BA, Sept. 2023).
    queries:
      - "Spedition"
      - "Transportunternehmen"
      - "Logistikunternehmen"
      - "Lagerlogistik Dienstleister"
    # Gemessen am 16.09.2026: industrial=haulage hat bundesweit 0 Objekte und ist damit als Tag
    # wertlos; office=logistics trägt 1.122 Objekte, davon 1.083 mit Namen und 611 mit Website.
    osm:
      - '["office"="logistics"]'
  planungsbuero:
    beschreibung: "Architektur- und Ingenieurbüros – 7.558 von 34.986 Architekturbüros haben 5–49 Beschäftigte (BAK/Destatis 2023); 77 % der Architekten wünschen KI-Fortbildung"
    queries:
      - "Architekturbüro"
      - "Ingenieurbüro"
      - "Planungsbüro Bau"
      - "Statikbüro"
    osm:
      - '["office"="architect"]'
      - '["office"="engineer"]'
  elektro_shk:
    beschreibung: "Elektro- und SHK-Betriebe – 48.178 E-Betriebe (Ø 10,7) und 48.050 SHK-Betriebe (Ø 8,1); 76 % der Handwerksbetriebe sehen Digitalkompetenzbedarf, nur 4 % nutzen KI (Bitkom 2025)"
    queries:
      - "Elektrotechnik Betrieb"
      - "Elektroinstallation Meisterbetrieb"
      - "Sanitär Heizung Klima Betrieb"
      - "Heizungsbau Betrieb"
    included_types: [electrician, plumber]
    osm:
      - '["craft"="electrician"]'
      - '["craft"="plumber"]'
      - '["craft"="hvac"]'
  metallbau:
    beschreibung: "Metallbau und Schlossereien – beste Belegschafts-Datenlage der Stichprobe (6 von 10 Betrieben belegen 5+), 53 % der Innungsbetriebe haben 5–25 Beschäftigte; Meister sitzt an der Betriebsadresse"
    # Kein included_type: „locksmith“ ist der Schlüsseldienst, nicht die Schlosserei – ein falscher Typ
    # verdirbt die Trefferliste. Deshalb Textsuche mit mehreren Begriffen.
    queries:
      - "Metallbau"
      - "Schlosserei"
      - "Metallbaumeister"
      - "Stahlbau Metallbau"
    # shop=metal_construction hat bundesweit genau ein Objekt. craft=metal_construction trifft zur
    # Hälfte: Zerspanung, Härterei und Maschinenbau tragen dasselbe Tag (eigene Messung 15.09.2026).
    osm:
      - '["craft"="metal_construction"]'
  dentallabor:
    beschreibung: "Zahntechnische Labore – 9 von 10 nennen den Inhaber, 7 von 10 belegen die Belegschaft (eigene Stichprobe 15.09.2026); ortsfester Betrieb, deshalb praktisch nie eine Handynummer"
    queries:
      - "Dentallabor"
      - "Zahntechnik"
      - "Zahntechnisches Labor"
      - "Zahntechnisches Meisterlabor"
    osm:
      - '["craft"="dental_technician"]'
  versicherung:
    beschreibung: "Versicherungs-/Finanzmakler – Vertriebler mit Handy, Büro-Personal mit Verwaltungsaufwand"
    queries:
      - "Versicherungsmakler"
      - "Versicherungsbüro"
      - "Finanzberatung"
      - "Versicherungsagentur"
    included_types: [insurance_agency]
  handwerk:
    beschreibung: "Handwerksbetriebe (Elektro, SHK, Bau, Schreiner, Maler) – meist Inhaber-geführt, oft Handynummer auf der Website"
    queries:
      - "Elektrotechnik Betrieb"
      - "Sanitär Heizung Klima Betrieb"
      - "Schreinerei"
      - "Malerbetrieb"
      - "Dachdecker"
      - "Bauunternehmen"
      - "Metallbau"
    included_types: [electrician, plumber, roofing_contractor, general_contractor, painter]
  steuer_recht:
    beschreibung: "Steuerberater, Wirtschaftsprüfer, Kanzleien – hoher Bürokratieanteil, KI-affin"
    queries:
      - "Steuerberater"
      - "Steuerberatungsgesellschaft"
      - "Rechtsanwaltskanzlei"
      - "Wirtschaftsprüfer"
    included_types: [accounting, lawyer]
  gesundheit:
    beschreibung: "Praxen, Pflegedienste, Physiotherapie, Apotheken – Dokumentationslast, viele Angestellte"
    queries:
      - "Pflegedienst"
      - "Physiotherapie Praxis"
      - "Zahnarztpraxis"
      - "Apotheke"
      - "Augenoptiker"
    included_types: [physiotherapist, dentist, pharmacy, home_health_care_service]
  auto_technik:
    beschreibung: "Autohäuser, Kfz-Werkstätten – Inhaber-geführt, 10-50 MA typisch"
    queries:
      - "Autohaus"
      - "Kfz-Werkstatt"
      - "Autolackiererei"
    included_types: [car_dealer, car_repair]
  agenturen_it:
    beschreibung: "Werbeagenturen, IT-Dienstleister, Softwarehäuser – KI-Nachfrage sehr hoch"
    queries:
      - "Werbeagentur"
      - "IT-Dienstleister"
      - "Softwareentwicklung"
      - "Digitalagentur"
  internet:
    beschreibung: "Internet-Firmen – E-Commerce, Onlineshops, Online-Marketing, Digital-/Webagenturen, Softwarehäuser; Belegschaft arbeitet fast vollständig am PC (Welle 4, 17.09.2026)"
    queries:
      - "E-Commerce Unternehmen"
      - "Online-Shop Versandhandel"
      - "Online-Marketing-Agentur"
      - "Digitalagentur Webagentur"
      - "Softwareentwicklung Softwarehaus"
      - "Amazon Agentur Fulfillment Dienstleister"
    # OSM-Ergänzung ohne Google: office=it und office=advertising_agency sind die dokumentierten Tags,
    # web_design/marketing/software stehen laut Taginfo mehrere tausend Mal in Deutschland. Der Namensregex
    # holt Shops und Agenturen, die ein anderes Tag tragen. Verworfen werden Filialen fremder Branchen.
    osm:
      - '["office"="it"]'
      - '["office"="advertising_agency"]'
      - '["office"="web_design"]'
      - '["office"="marketing"]'
      - '["office"="software"]'
      - '["name"~"Digitalagentur|Webagentur|Internetagentur|Online-?Marketing|E-?Commerce|Onlineshop|Online-?Shop|Softwareentwicklung|Software GmbH|SEO|Versandhandel",i]'
  internet_erweitert:
    beschreibung: "Zweite OSM-Runde für Internet-Firmen (17.09.2026): Grafikdesign, IT-Systemhäuser, Software- und Medienfirmen, die unter office=company oder ohne Branchentag stehen; Namensregex"
    queries:
      - "IT-Systemhaus"
      - "Webdesign Agentur"
    osm:
      - '["office"="graphic_design"]'
      - '["office"="company"]["name"~"Digital|Media|Medien|Web|Online|Software|Internet|Agentur|Design|Cloud|Data|Systemhaus|IT-|EDV|App",i]'
      - '["office"="consulting"]["name"~"IT|Digital|Software|Web|Online|Data",i]'
      - '["office"]["name"~"Systemhaus|IT-Service|IT Service|EDV|Softwarehaus|Webdesign|Web-Design|Mediendesign|Medienagentur|Werbeagentur|Kommunikationsagentur|Kreativagentur|Marketingagentur|Onlinehandel|Online-Handel|Cloud|App-Entwicklung",i]'
  internet_runde3:
    beschreibung: "Dritte OSM-Runde für Internet-Firmen (17.09.2026): office=yes und weitere Namensmuster unter office=company, shop=computer mit IT-Service-Namen"
    queries:
      - "IT-Service"
    osm:
      - '["office"="yes"]["name"~"Systemhaus|IT-Service|IT Service|EDV|Software|Webdesign|Web-Design|Mediendesign|Medienagentur|Werbeagentur|Kommunikationsagentur|Kreativagentur|Marketingagentur|Digital|Online|Cloud|App",i]'
      - '["office"="company"]["name"~"Systemhaus|EDV|Consulting|Solutions|Systems|Tech|Labs|Studio|Kommunikation|Marketing|Werbung|Concept|Kreativ|Interactive|Apps|Network|Netzwerk",i]'
      - '["shop"="computer"]["name"~"Service|Systemhaus|IT|EDV|Software|Netzwerk",i]'
      - '["office"="telecommunication"]["name"~"IT|Software|Systemhaus|EDV|Digital",i]'
  personalagentur:
    beschreibung: "Personalagenturen, Personalberatung, Zeitarbeit, Recruiting – Berater geben ihr Handy an, Arbeit am PC (Nachtlauf 17.09.2026)"
    queries:
      - "Personalvermittlung"
      - "Personalberatung"
    osm:
      - '["office"="employment_agency"]'
      - '["office"]["name"~"Personal(?:vermittlung|beratung|dienst|service|agentur|management|leasing)|Zeitarbeit|Recruit|Headhunt|Arbeitsvermittlung|Interim|Staffing",i]'
    osm_nicht_name: 'Agentur für Arbeit|Jobcenter|Bundesagentur|Randstad|Adecco|Manpower|Hays|Persona service|Tempton|Piening|Orizon|Amadeus FiRe|Robert Half|Trenkwalder|Synergie|Unique|Akzent|Franz & Wach|Start People|Kelly|Brunel|Ferchau|Gulp|DIS AG|Studitemps|Zenjob|Timing|Job AG|Bertrandt|Airbus|Volkswagen|Siemens'
  ecommerce:
    beschreibung: "Onlineshops und Versandhändler nach Namen in OpenStreetMap (Nachtlauf 17.09.2026)"
    queries:
      - "Online-Shop Versandhandel"
    osm:
      - '["office"]["name"~"Onlineshop|Online-Shop|Online Shop|Onlinehandel|Online-Handel|E-?Commerce|Versandhandel|Versandhaus|Webshop|shop24|24\.de|Onlineversand|Marktplatz",i]'
      - '["shop"]["name"~"Onlineshop|Online-Shop|Online Shop|Onlinehandel|Online-Handel|E-?Commerce|Versandhandel|Versandhaus|Webshop|shop24|24\.de|Onlineversand",i]'
      - '["craft"]["name"~"Onlineshop|Online-Shop|Onlinehandel|E-?Commerce|Versandhandel|Webshop",i]'
    osm_nicht_name: 'Amazon|Zalando|Otto GmbH|Otto Group|MediaMarkt|Saturn|Conrad|Cyberport|notebooksbilliger|Thomann|Douglas|About You|Home24|Westwing|Zooplus|Fressnapf|Lidl|Aldi|Rewe|Edeka|Kaufland|Tchibo|Bonprix|Baur|Klingel|Witt|Heine|Schwab|DHL|Hermes|DPD|GLS|UPS'
  internet_sonstige:
    beschreibung: "Sonstige Internet-Firmen: Portale, Plattformen, Hosting, SaaS, Apps, Online-Dienste (Nachtlauf 17.09.2026)"
    queries:
      - "Internetportal"
    osm:
      - '["office"="company"]["name"~"Portal|Plattform|Platform|Hosting|Cloud|SaaS|\bApp|Apps\b|Online|Internet|Netz\b|\.de\b|\.com\b|Digital|Web\b|Media|Medien|Software|Data|Daten|Tech\b|Labs|Studio|Solutions|Systems|Interactive|Network|Netzwerk|Kommunikation|Consulting|Marketing|Werbung|Design|Kreativ|Agentur",i]'
      - '["office"="yes"]["name"~"Portal|Plattform|Platform|Hosting|Cloud|SaaS|\bApp|Apps\b|Online|Internet|Digital|Web\b|Media|Medien|Software|Data|Daten|Agentur|Marketing|Design",i]'
      - '["office"="coworking"]'
    osm_nicht_name: 'Telekom|Vodafone|Telefónica|1&1|United Internet|Ionos|Strato|Hetzner|SAP|Microsoft|Google|Amazon|Meta|Apple|IBM|Oracle|Adobe|Salesforce|Bertelsmann|Axel Springer|ProSieben|RTL|Funke|Burda'
  versicherung_finanz:
    beschreibung: "Versicherungsmakler, Finanz- und Vermögensberater – unabhängige Büros, keine Konzernagenturen (Nachtlauf 17.09.2026)"
    queries:
      - "Versicherungsmakler"
      - "Finanzberatung"
    osm:
      - '["office"="insurance"]'
      - '["office"="financial_advisor"]'
      - '["office"="financial"]'
      - '["office"]["name"~"Versicherungsmakler|Finanzmakler|Finanzberat|Vermögensberat|Finanzplan|Versicherungsbüro|Assekuranz|Finanzdienst|Baufinanzierung|Vorsorge",i]'
    osm_nicht_name: 'Allianz|ERGO|HUK|DEVK|LVM|Provinzial|Generali|AXA|Signal Iduna|Debeka|R\+V|Württembergische|Zurich|Gothaer|Nürnberger|Continentale|Barmenia|Concordia|VGH|Sparkasse|Volksbank|Raiffeisen|Deutsche Vermögensberatung|DVAG|Swiss Life|MLP|OVB|tecis|Wüstenrot|Alte Leipziger|HDI|Basler|Helvetia|Mecklenburgische|Münchener Verein|Bayerische|Öffentliche|Itzehoer|WGV|Postbank|Commerzbank|Targobank|Santander|Bausparkasse|Schwäbisch Hall|LBS|Deutsche Bank|Hypovereinsbank|Unicredit|ING|Check24|Verivox|Interhyp|Dr\. Klein|Hüttig|Ecclesia|Aon|Marsh|Funk Gruppe|Kuhn & Bülow|Krankenkasse|AOK|Barmer|TK|DAK|KKH|IKK|BKK|Berufsgenossenschaft|Rentenversicherung|Versorgungswerk|Landesbank|KfW'
  grosshandel:
    beschreibung: "Großhandel (WZ 46) – 8.676 Unternehmen mit 20–49 tätigen Personen und 262.230 Beschäftigten darin (Eurostat SBS 2023); 60,8 % davon arbeiten am Bildschirm, und nur 21 % der Handelsbetriebe nutzen KI"
    # Warum diese Branche: Sie verbindet die drei Größen, auf die es ankommt. Masse (doppelt so
    # viele Zielunternehmen wie IT), weißer Fleck (71 % der Handelsbetriebe nutzen KI weder noch
    # planen sie es, IAB-Betriebspanel 2025) und Bürobelegschaft (60,8 %, gemessen über die
    # Kreuzung Berufsgruppe × Anforderungsniveau × WZ 46 der BA zum 30.06.2025).
    #
    # Die größten Berufsgruppen im Großhandel sind Einkauf und Vertrieb (194.710 Beschäftigte),
    # Büro und Sekretariat (125.080) und Unternehmensorganisation (117.860) – also genau die
    # Berufsgruppen 713 und 714, die die Arbeitsagenturen in ihren Bildungszielplanungen 2026
    # namentlich mit KI verknüpfen ("KI im Kontext Büro", "Anwendung KI im Arbeitskontext").
    #
    # OSM trägt diese Branche schlecht: shop=wholesale hat bundesweit 1.683 Objekte, davon 811 mit
    # Website – gegen 8.676 Zielunternehmen sind das 19 % Abdeckung (gemessen 16.09.2026).
    # office=wholesale hat genau 1 Objekt, industrial=wholesale keines, office=company trifft mit
    # 41.169 Objekten alle Firmenbüros und damit nichts Bestimmtes. Namensfilter greifen nicht:
    # Großhändler führen ihre Branche nicht im Namen (Bremen: 4 Treffer), bundesweit läuft die
    # Abfrage in einen 504. Die Masse kommt deshalb über `leadscraper enrich-list` aus
    # Verbands- und Verbundgruppenverzeichnissen, nicht über `leadscraper osm`.
    osm:
      - '["shop"="wholesale"]'
    # Verbrauchermärkte mit Großhandelslizenz haben Filialleiter statt Inhaber und fallen raus
    osm_nicht_name: 'Metro|Selgros|Handelshof|Fegro|Transgourmet|Edeka|Rewe|Lidl|Aldi'
    queries:
      - "Großhandel"
      - "Technischer Handel Industriebedarf"
      - "Elektrogroßhandel"
      - "Sanitär Heizung Großhandel"
      - "Baustoffhandel"
  logistik_handel:
    beschreibung: "Spedition, Großhandel, Lager – Prozessdigitalisierung"
    queries:
      - "Spedition"
      - "Großhandel"
      - "Logistikunternehmen"
      - "Kurierdienst"
    included_types: [moving_company, courier_service]
  produktion:
    beschreibung: "Kleine Industrie/Maschinenbau/Zulieferer"
    queries:
      - "Maschinenbau"
      - "Metallverarbeitung"
      - "Kunststoffverarbeitung"
      - "Werkzeugbau"
      - "Feinmechanik"
  immobilien_finanzen:
    beschreibung: "Makler, Hausverwaltungen, Versicherungsbüros"
    queries:
      - "Immobilienmakler"
      - "Hausverwaltung"
      - "Versicherungsbüro"
    included_types: [real_estate_agency, insurance_agency]
  gastro_hotel:
    beschreibung: "Hotels & größere Gastronomie (nur bedingt KI-affin, aber Personalstärke passt)"
    queries:
      - "Hotel"
      - "Restaurant"
      - "Catering"
    included_types: [hotel, restaurant]
