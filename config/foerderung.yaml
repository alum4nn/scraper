# Förderlogik für den Pitch. Werte aus Recherche (13.09.2026) gegen gesetze-im-internet.de / arbeitsagentur.de
# (Suchmaschinen-Snippets der Primärquellen, Volltext war nicht abrufbar) – vor Kundengesprächen prüfen!
# Rechtsstand § 82 SGB III: Fördersätze seit 01.04.2024 (Gesetz zur Stärkung der Aus- und Weiterbildungsförderung),
# Wartefristen 2 Jahre seit 01.01.2025 (SGB III-Modernisierungsgesetz).
stand: "2026-09-13"
bund:
  gesetz: "§ 82 SGB III"
  quelle: "https://www.gesetze-im-internet.de/sgb_3/__82.html"
  quelle_ba: "https://www.arbeitsagentur.de/unternehmen/finanziell/foerderung-von-weiterbildung"
  # Betriebsgröße: die wichtigste und meistübersehene Regel der ganzen Förderung.
  # § 82 Abs. 6 Satz 3 SGB III im Wortlaut (geprüft am 16.09.2026 an gesetze-im-internet.de):
  #   „Bei der Feststellung der Zahl der Beschäftigten sind zu berücksichtigen,
  #    1. Teilzeitbeschäftigte mit einer regelmäßigen wöchentlichen Arbeitszeit von
  #       a) nicht mehr als zehn Stunden mit 0,25, b) nicht mehr als 20 Stunden mit 0,50
  #       und c) nicht mehr als 30 Stunden mit 0,75 und
  #    2. … sämtliche Beschäftigte des Unternehmens, dem der Betrieb angehört, und, falls das
  #       Unternehmen einem Konzern angehört, die Zahl der Beschäftigten des Konzerns.“
  # Daraus folgt für die Zielauswahl:
  #  * Kopfzahl ist NICHT Betriebsgröße. Wer über 30 Wochenstunden arbeitet, zählt voll; darunter
  #    gestaffelt. Auszubildende, Praktikanten und geringfügig Beschäftigte zählen nach den Fachlichen
  #    Weisungen (Ziffer 7 Abs. 2) gar nicht mit.
  #  * Ein Einzelbetrieb mit 60 bis 80 Köpfen und viel Teilzeit kann damit unter 50 liegen – viele
  #    mögliche Teilnehmer bei vollem Fördersatz. Das ist das wirtschaftlich beste Ziel.
  #  * Umgekehrt zählt bei Filialen, Tochtergesellschaften und Konzernbetrieben das GANZE Unternehmen.
  #    Mehrstandort-Betriebe fallen deshalb fast immer aus dem 100-Prozent-Band.
  #  * Maßgeblich ist der Stand bei Maßnahmebeginn; der Arbeitgeber erklärt ihn selbst.
  teilzeitstaffel:
    - bis_wochenstunden: 10
      zaehlt: 0.25
    - bis_wochenstunden: 20
      zaehlt: 0.50
    - bis_wochenstunden: 30
      zaehlt: 0.75
    - bis_wochenstunden: null
      zaehlt: 1.0
  nicht_mitgezaehlt: ["Auszubildende", "Praktikanten", "geringfügig Beschäftigte"]
  groessenklassen:
    - band: "<50"
      min: 0
      max: 49
      lehrgangskosten_pct: 100
      arbeitsentgeltzuschuss_pct: 75
    - band: "50-499"
      min: 50
      max: 499
      lehrgangskosten_pct: 50
      arbeitsentgeltzuschuss_pct: 50
    - band: ">=500"
      min: 500
      max: null
      lehrgangskosten_pct: 25
      arbeitsentgeltzuschuss_pct: 25
  bonus:
    - "+5 Prozentpunkte Lehrgangskosten UND Arbeitsentgeltzuschuss bei Betriebsvereinbarung oder Tarifvertrag zur Weiterbildung"
    - "100 % Lehrgangskosten für Beschäftigte ab 45 Jahren oder mit Schwerbehinderung in Betrieben unter 500 Beschäftigten"
    - "Bis zu 100 % Arbeitsentgeltzuschuss bei Beschäftigten ohne Berufsabschluss in abschlussbezogener Weiterbildung"
  voraussetzungen:
    - "Maßnahme > 120 Stunden; Träger UND Maßnahme nach AZAV zugelassen"
    - "Kenntnisse, die über kurzfristige arbeitsplatzbezogene Anpassungsfortbildung hinausgehen (kein reines Tool-Training)"
    - "Berufsabschluss bzw. letzte geförderte Weiterbildung liegt i. d. R. mindestens 2 Jahre zurück"
    - "Antrag VOR Maßnahmebeginn beim Arbeitgeber-Service der Agentur für Arbeit; Sammelantrag für mehrere Beschäftigte möglich"
    - "Keine Kumulierung derselben Kosten mit Landesprogrammen (Doppelförderungsverbot)"
  qualifizierungsgeld: >-
    §§ 82a–82c SGB III (seit 01.04.2024): Entgeltersatz (60 %/67 % der Nettoentgeltdifferenz) bei strukturwandelbedingtem
    Qualifizierungsbedarf für mind. 20 % der Belegschaft (10 % bei < 250 Beschäftigten), Maßnahme > 120 Stunden,
    Betriebsvereinbarung/Tarifvertrag nötig, Lehrgangskosten trägt der Arbeitgeber. Für Kleinbetriebe selten relevant.
